<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs><style>text { font-family: "Noto Serif CJK TC", serif; fill: #333B41; }</style></defs>
  <rect width="1440" height="960" fill="#F7F2E6"/>
  <rect x="20" y="20" width="1400" height="920" fill="none" stroke="#C8A356" stroke-width="2"/>

  <text x="720" y="90" text-anchor="middle" font-size="34" fill="#1F3A4D" font-weight="bold" letter-spacing="4">人類最長壽的組織，是使命型醫院</text>

  <!-- medieval gatehouse -->
  <g transform="translate(720,0)">
    <!-- side walls -->
    <rect x="-560" y="620" width="380" height="170" fill="#1F3A4D" opacity="0.28"/>
    <rect x="180" y="620" width="380" height="170" fill="#1F3A4D" opacity="0.28"/>
    <g fill="#F7F2E6">
      <rect x="-500" y="655" width="40" height="60" rx="18"/><rect x="-410" y="655" width="40" height="60" rx="18"/><rect x="-320" y="655" width="40" height="60" rx="18"/><rect x="-240" y="655" width="40" height="60" rx="18"/>
      <rect x="200" y="655" width="40" height="60" rx="18"/><rect x="280" y="655" width="40" height="60" rx="18"/><rect x="370" y="655" width="40" height="60" rx="18"/><rect x="460" y="655" width="40" height="60" rx="18"/>
    </g>

    <!-- central tower -->
    <rect x="-180" y="300" width="360" height="490" fill="#1F3A4D"/>
    <!-- battlements -->
    <g fill="#1F3A4D">
      <rect x="-180" y="268" width="52" height="34"/><rect x="-104" y="268" width="52" height="34"/>
      <rect x="-26" y="268" width="52" height="34"/><rect x="52" y="268" width="52" height="34"/>
      <rect x="128" y="268" width="52" height="34"/>
    </g>
    <!-- niche with lamp of hope -->
    <path d="M -42 350 a42 42 0 0 1 84 0 v 84 h -84 z" fill="#F7F2E6"/>
    <g transform="translate(0,408)">
      <path d="M -16 0 h32 l -6 26 h -20 z" fill="#C8A356"/>
      <path d="M 0 -14 q 10 8 0 20 q -10 -12 0 -20" fill="#A4432E"/>
      <line x1="0" y1="-26" x2="0" y2="-14" stroke="#8A7B62" stroke-width="3"/>
    </g>
    <!-- windows -->
    <g fill="#F7F2E6">
      <path d="M -120 500 a24 24 0 0 1 48 0 v 56 h -48 z"/>
      <path d="M -24 500 a24 24 0 0 1 48 0 v 56 h -48 z"/>
      <path d="M 72 500 a24 24 0 0 1 48 0 v 56 h -48 z"/>
    </g>
    <!-- arched gate -->
    <path d="M -92 790 v -110 a92 92 0 0 1 184 0 v 110 z" fill="#F7F2E6"/>
    <path d="M -92 790 v -110 a92 92 0 0 1 184 0 v 110" fill="none" stroke="#C8A356" stroke-width="6"/>
    <line x1="0" y1="592" x2="0" y2="790" stroke="#8A7B62" stroke-width="4"/>
  </g>

  <!-- ground -->
  <line x1="120" y1="790" x2="1320" y2="790" stroke="#8A7B62" stroke-width="4"/>

  <g font-size="24" text-anchor="middle">
    <text x="720" y="850">倫敦聖巴多羅買醫院（1123）・巴黎主宮醫院（傳 651）・佛羅倫斯新聖母醫院（1288）</text>
    <text x="720" y="895" font-size="26" fill="#1F3A4D" font-weight="bold">同一個地點、不間斷的照護，九百年——引擎是超越利潤的存在理由</text>
  </g>
</svg>
