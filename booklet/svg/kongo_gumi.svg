<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs><style>text { font-family: "Noto Serif CJK TC", serif; fill: #333B41; }</style></defs>
  <rect width="1440" height="960" fill="#F7F2E6"/>
  <rect x="20" y="20" width="1400" height="920" fill="none" stroke="#C8A356" stroke-width="2"/>

  <!-- sun disc -->
  <circle cx="1060" cy="230" r="95" fill="#C8A356" opacity="0.75"/>
  <!-- cloud bands -->
  <g stroke="#D8CBAE" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="930" y1="300" x2="1220" y2="300"/>
    <line x1="1000" y1="336" x2="1290" y2="336"/>
    <line x1="240" y1="230" x2="470" y2="230"/>
    <line x1="180" y1="268" x2="380" y2="268"/>
  </g>

  <!-- five-storied pagoda -->
  <g transform="translate(660,0)" fill="#1F3A4D">
    <!-- spire -->
    <line x1="0" y1="255" x2="0" y2="118" stroke="#1F3A4D" stroke-width="7"/>
    <g stroke="#1F3A4D" stroke-width="5" fill="none">
      <circle cx="0" cy="140" r="14"/><circle cx="0" cy="172" r="17"/><circle cx="0" cy="206" r="20"/>
    </g>
    <circle cx="0" cy="112" r="9"/>

    <!-- roofs and bodies, bottom to top -->
    <!-- tier 5 (top) -->
    <rect x="-50" y="272" width="100" height="103" opacity="0.92"/>
    <path d="M -120 262 Q 0 208 120 262 L 104 284 Q 0 240 -104 284 Z"/>
    <!-- tier 4 -->
    <rect x="-60" y="375" width="120" height="105" opacity="0.92"/>
    <path d="M -148 365 Q 0 305 148 365 L 130 388 Q 0 340 -130 388 Z"/>
    <!-- tier 3 -->
    <rect x="-72" y="480" width="144" height="110" opacity="0.92"/>
    <path d="M -180 470 Q 0 404 180 470 L 160 494 Q 0 438 -160 494 Z"/>
    <!-- tier 2 -->
    <rect x="-85" y="590" width="170" height="110" opacity="0.92"/>
    <path d="M -215 580 Q 0 508 215 580 L 193 605 Q 0 545 -193 605 Z"/>
    <!-- tier 1 (bottom) -->
    <rect x="-100" y="700" width="200" height="112" opacity="0.92"/>
    <path d="M -255 690 Q 0 610 255 690 L 230 716 Q 0 650 -230 716 Z"/>

    <!-- door and window slits in parchment -->
    <g fill="#F7F2E6">
      <rect x="-16" y="742" width="32" height="70" rx="14"/>
      <rect x="-58" y="752" width="10" height="40"/><rect x="48" y="752" width="10" height="40"/>
      <rect x="-12" y="630" width="24" height="44" rx="10"/>
      <rect x="-10" y="518" width="20" height="40" rx="9"/>
      <rect x="-9" y="408" width="18" height="38" rx="8"/>
      <rect x="-8" y="300" width="16" height="34" rx="7"/>
    </g>
  </g>

  <!-- ground -->
  <line x1="150" y1="812" x2="1290" y2="812" stroke="#8A7B62" stroke-width="4"/>
  <g stroke="#8A7B62" stroke-width="3" stroke-linecap="round">
    <line x1="260" y1="836" x2="420" y2="836"/><line x1="900" y1="836" x2="1120" y2="836"/>
  </g>

  <text x="330" y="420" font-size="40" fill="#1F3A4D" font-weight="bold" writing-mode="tb" letter-spacing="10">世界最古老的企業</text>
  <text x="255" y="420" font-size="30" fill="#8A7B62" writing-mode="tb" letter-spacing="8">金剛組・五七八年</text>

  <text x="720" y="893" text-anchor="middle" font-size="26" fill="#333B41">一千四百年的寺廟手藝，敵不過 1980 年代一次錯誤的房地產槓桿（578 – 2006）</text>
</svg>
