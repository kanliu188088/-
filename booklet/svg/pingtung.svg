<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>text { font-family: "Noto Serif CJK TC", serif; fill: #333B41; }</style></defs>
  <rect width="1440" height="900" fill="#F7F2E6"/>
  <rect x="20" y="20" width="1400" height="860" fill="none" stroke="#C8A356" stroke-width="2"/>

  <text x="720" y="90" text-anchor="middle" font-size="34" fill="#1F3A4D" font-weight="bold" letter-spacing="4">從畢士大診所到智能醫療大樓</text>

  <!-- sun -->
  <circle cx="245" cy="240" r="70" fill="#C8A356" opacity="0.7"/>

  <!-- 1953 clinic: small chapel house -->
  <g transform="translate(400,0)">
    <!-- palm tree -->
    <g transform="translate(-190,0)">
      <path d="M 0 700 C -6 610 -2 560 6 520" stroke="#6B7F5E" stroke-width="10" fill="none"/>
      <g stroke="#6B7F5E" stroke-width="8" fill="none" stroke-linecap="round">
        <path d="M 6 520 C -40 490 -80 490 -110 510"/>
        <path d="M 6 520 C 50 488 92 490 120 512"/>
        <path d="M 6 520 C -20 470 -50 455 -85 455"/>
        <path d="M 6 520 C 30 468 62 452 96 452"/>
      </g>
    </g>
    <!-- house -->
    <rect x="-90" y="560" width="240" height="140" fill="#1F3A4D"/>
    <path d="M -110 560 L 30 470 L 170 560 Z" fill="#8C6239"/>
    <path d="M -8 640 a20 20 0 0 1 40 0 v 60 h -40 z" fill="#F7F2E6"/>
    <rect x="-64" y="612" width="36" height="42" fill="#F7F2E6" rx="6"/>
    <rect x="92" y="612" width="36" height="42" fill="#F7F2E6" rx="6"/>
    <!-- cross on roof -->
    <g fill="#A4432E"><rect x="24" y="408" width="12" height="52"/><rect x="8" y="422" width="44" height="12"/></g>
    <text x="30" y="756" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3A4D">1953・畢士大診所</text>
    <text x="30" y="792" text-anchor="middle" font-size="21" fill="#8A7B62">痲瘋・肺結核・小兒麻痺</text>
  </g>

  <!-- dashed path -->
  <path d="M 580 660 C 700 620 760 620 880 660" stroke="#8A7B62" stroke-width="4" fill="none" stroke-dasharray="12 10"/>
  <path d="M 880 660 l -24 -4 l 9 20 z" fill="#8A7B62"/>
  <text x="730" y="596" text-anchor="middle" font-size="23" fill="#8C6239" font-style="italic">七十三年・同一個呼召</text>

  <!-- 2026 tower -->
  <g transform="translate(1050,0)">
    <rect x="-80" y="300" width="200" height="400" fill="#1F3A4D"/>
    <rect x="120" y="420" width="110" height="280" fill="#1F3A4D" opacity="0.55"/>
    <g fill="#F7F2E6">
      <rect x="-58" y="330" width="34" height="26" rx="4"/><rect x="4" y="330" width="34" height="26" rx="4"/><rect x="64" y="330" width="34" height="26" rx="4"/>
      <rect x="-58" y="382" width="34" height="26" rx="4"/><rect x="4" y="382" width="34" height="26" rx="4"/><rect x="64" y="382" width="34" height="26" rx="4"/>
      <rect x="-58" y="434" width="34" height="26" rx="4"/><rect x="4" y="434" width="34" height="26" rx="4"/><rect x="64" y="434" width="34" height="26" rx="4"/>
      <rect x="-58" y="486" width="34" height="26" rx="4"/><rect x="4" y="486" width="34" height="26" rx="4"/><rect x="64" y="486" width="34" height="26" rx="4"/>
      <rect x="-58" y="538" width="34" height="26" rx="4"/><rect x="4" y="538" width="34" height="26" rx="4"/><rect x="64" y="538" width="34" height="26" rx="4"/>
      <rect x="-58" y="590" width="34" height="26" rx="4"/><rect x="4" y="590" width="34" height="26" rx="4"/><rect x="64" y="590" width="34" height="26" rx="4"/>
      <rect x="138" y="450" width="26" height="20" rx="4"/><rect x="182" y="450" width="26" height="20" rx="4"/>
      <rect x="138" y="500" width="26" height="20" rx="4"/><rect x="182" y="500" width="26" height="20" rx="4"/>
      <rect x="138" y="550" width="26" height="20" rx="4"/><rect x="182" y="550" width="26" height="20" rx="4"/>
      <rect x="138" y="600" width="26" height="20" rx="4"/><rect x="182" y="600" width="26" height="20" rx="4"/>
      <path d="M -6 650 a26 26 0 0 1 52 0 v 50 h -52 z"/>
    </g>
    <g fill="#A4432E"><rect x="12" y="228" width="16" height="62"/><rect x="-9" y="246" width="58" height="16"/></g>
    <text x="40" y="756" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3A4D">2026・861 床智能醫療大樓</text>
    <text x="40" y="792" text-anchor="middle" font-size="21" fill="#8A7B62">現址轉型長照・自籌 34 億元</text>
  </g>

  <!-- ground -->
  <line x1="120" y1="700" x2="1320" y2="700" stroke="#8A7B62" stroke-width="4"/>

  <text x="720" y="852" text-anchor="middle" font-size="27" fill="#8C6239" letter-spacing="4">「哪裡有需要，就往哪裡去」</text>
</svg>
